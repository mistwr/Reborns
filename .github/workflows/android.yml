name: Build Reborn APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: reborn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test server, providers and approvals
        run: npm test --prefix server
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug || {
            cat app/build/reports/lint-results-debug.txt
            exit 1
          }
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android_smoke.py
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Reborn-0.1.1-preview.apk
          cd dist
          sha256sum Reborn-0.1.1-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reborn-build-${{ github.run_number }}
          path: |
            dist/
            qa/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
      - name: Publish installable preview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.1-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/Reborn-0.1.1-preview.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Reborn 0.1.1 — preview ${GITHUB_RUN_NUMBER}" --notes-file docs/release-notes.md --prerelease
